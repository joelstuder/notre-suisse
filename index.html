<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://vectortiles.geo.admin.ch" crossorigin><link rel="preconnect" href="https://elevation-tiles-prod.s3.amazonaws.com" crossorigin>
<title>Notre Suisse</title>
<link rel="stylesheet" href="maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Caveat:wght@600;700&family=Nunito:wght@500;700&display=swap">
<style>
/* VOICE: tendre et joueur, un cadeau à ouvrir chaque matin.
   IDEA: la Suisse comme un plateau de jeu illustré qui flotte, posé sur le vrai relief swisstopo.
   PICTURE: la carte 3D plein écran, peuplée de dessins, fanions de villes et monuments du jour qui brillent.
   COLOUR and TYPE: fond glacier uni, vert prairie, bleu lac, rouge suisse #d52b1e ; Baloo 2 + Nunito.
   LAYOUT: carte plein cadre, étiquette et deux boutons en haut à gauche, 24 portes en bas. */
:root{color-scheme:light dark;--bg:light-dark(#fffdf7,#1a1c1a);--ink:light-dark(#1f2a1f,#f3f1e9);--mute:light-dark(#5d6a5d,#b3bab0);--red:#d52b1e;--red2:#a91d13;--panel:light-dark(rgba(255,253,247,.96),rgba(26,28,26,.94));--line:light-dark(#e5e0d2,#353a35);--gold:#f2c230}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:#e6eef2;color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;--k:1}
h1,h2,.num,.tag,.tile,.flag b,.chip{font-family:"Baloo 2",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}
.head{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:5;max-width:min(420px,calc(100vw - 76px))}
.tag{display:inline-flex;align-items:center;background:var(--red);color:#fff;font-weight:800;font-size:26px;line-height:1;padding:10px 16px 8px;border-radius:10px;transform:rotate(-2deg);box-shadow:0 4px 0 var(--red2),0 8px 20px rgba(0,0,0,.2);border:2px dashed rgba(255,255,255,.55)}
.head{display:flex;gap:8px;align-items:center}#bfs{color:var(--ink)}
.ib{width:44px;height:44px;border-radius:50%;border:0;padding:8px;background:var(--panel);box-shadow:0 3px 10px rgba(0,0,0,.15);flex:none}.ib svg{width:100%;height:100%;display:block}
.lang{display:inline-flex;background:var(--panel);border-radius:20px;padding:3px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.lang button{border:0;background:none;min-width:40px;min-height:36px;border-radius:16px;font-weight:700;font-size:14px}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.hud{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 10px;border:0;border-radius:22px;background:var(--panel);box-shadow:0 4px 14px rgba(0,0,0,.15);font-weight:700;font-size:15px}
.chip svg{width:26px;height:26px;flex:none}
.chip em{font-style:normal;background:var(--gold);color:#3a2a00;border-radius:10px;padding:0 7px;font-size:13px}
.strip{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 12px max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(30,60,70,.28));scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.door{flex:none;scroll-snap-align:start;width:76px;height:96px;border:0;padding:0;background:#fff7dc;border-radius:12px 12px 8px 8px;position:relative;perspective:500px;box-shadow:0 5px 0 rgba(0,0,0,.18),0 8px 16px rgba(0,0,0,.2)}
.door .in{position:absolute;inset:0;display:grid;place-items:center;padding:6px;font-size:11px;line-height:1.15;text-align:center;color:var(--red2);font-weight:700}
.door .in{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:14px 4px 6px}.door .di{width:46px;height:46px;flex:none}.door .nm{font-size:10.5px;line-height:1.1;max-height:2.3em;overflow:hidden}.door .dn{position:absolute;top:4px;left:7px;font:800 13px/1 "Baloo 2",sans-serif}.door .pb{position:absolute;top:3px;right:4px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #c9c2b0;display:grid;place-items:center;font:800 13px/1 Nunito,sans-serif;color:#fff}.door .pb svg{width:14px;height:14px}.door .pb.ok{background:#2e9d5b;border-color:#2e9d5b}
.door .leaf{position:absolute;inset:0;border-radius:12px 12px 8px 8px;background:var(--red);color:#fff;display:grid;place-items:center;transform-origin:left center;transition:transform .9s cubic-bezier(.3,.7,.2,1);backface-visibility:hidden;box-shadow:inset 0 0 0 4px rgba(255,255,255,.22),inset 0 -14px 0 rgba(0,0,0,.08)}
.door .leaf .num{font-size:36px;font-weight:800;line-height:1}
.door .leaf small{position:absolute;bottom:8px;font-size:11px;font-weight:700;opacity:.9}
.door .leaf::after{content:"";position:absolute;right:9px;top:52%;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.door.open .leaf{transform:rotateY(-108deg)}
.door.locked .leaf{background:#8e9a9c;box-shadow:inset 0 0 0 4px rgba(255,255,255,.15)}
.door.locked{cursor:not-allowed}
.door.today .leaf{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 0 0 4px #fff,0 0 0 5px rgba(242,194,48,.8)}}
.card{position:fixed;z-index:6;left:12px;right:12px;bottom:132px;max-height:calc(100dvh - 300px);overflow:auto;background:var(--panel);border-radius:20px;padding:0;box-shadow:0 14px 44px rgba(0,0,0,.28);display:none;scrollbar-width:thin;overscroll-behavior:contain}
.card.show{display:block;animation:cin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes cin{from{opacity:0;transform:translateY(14px)}}
.card .body{padding:16px 22px 20px}
.card .k{display:inline-block;background:var(--gold);color:#3a2a00;font-weight:800;font-size:13px;border-radius:12px;padding:1px 10px}
.card h2{margin:8px 0 2px;font-size:34px;line-height:1}
.card .sub{display:flex;align-items:center;gap:6px;color:var(--mute);font-weight:700;font-size:14px;margin:0 0 14px}
.card .sub svg{width:16px;height:16px;flex:none}
.card p{margin:0 0 12px;font-size:15.5px;line-height:1.62}
.card .x{position:absolute;top:10px;right:10px;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#1f2a1f;font-size:24px;line-height:1;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.card.plain .x{background:none;box-shadow:none;color:var(--mute)}
.card.plain .body{padding-right:52px}
.gal{position:relative;border-radius:20px 20px 0 0;overflow:hidden;background:#2a2f2a}
.gal .stage{position:relative;aspect-ratio:16/10;display:block;width:100%;border:0;padding:0;background:none;cursor:zoom-in}
.gal .s{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s ease;display:block}
.gal .s.on{opacity:1}
.gal .cap{position:absolute;left:0;right:0;bottom:0;padding:34px 18px 11px;background:linear-gradient(transparent,rgba(0,0,0,.66));color:#fff;font-weight:700;font-size:14.5px;line-height:1.3;text-align:left;pointer-events:none}
.gal .cap small{display:block;font-weight:500;font-size:10.5px;opacity:.72;margin-top:3px}
.gal .nv{position:absolute;top:calc(50% - 22px);z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#1f2a1f;font:800 22px/1 Nunito,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.25);opacity:0;transition:opacity .25s}
.gal .nv.p{left:10px}.gal .nv.n{right:10px}
.gal:hover .nv,.gal .nv:focus-visible{opacity:1}
.gal .cnt{position:absolute;top:14px;left:14px;z-index:2;background:rgba(0,0,0,.5);color:#fff;font:700 12px/1 Nunito,sans-serif;padding:5px 9px;border-radius:10px}
.thumbs{display:flex;gap:8px;padding:10px 14px 0}
.thumbs button{flex:1;aspect-ratio:4/3;border:0;padding:0;border-radius:9px;overflow:hidden;background:#ddd;opacity:.55;transition:opacity .2s,transform .2s}
.thumbs button img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button.on{opacity:1;box-shadow:0 0 0 3px var(--red)}
.thumbs button:hover{opacity:.9;transform:translateY(-2px)}
.plan{background:color-mix(in srgb,var(--gold) 16%,var(--panel));border-left:5px solid var(--gold);border-radius:12px;padding:12px 16px 4px;margin:6px 0 14px}
.plan h3,.why h3{margin:0 0 4px;font:800 13px/1.2 "Baloo 2",sans-serif;text-transform:uppercase;letter-spacing:.06em;color:#9a6b00}
.plan p{font-size:15px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.fact{display:grid;justify-items:center;text-align:center;gap:4px;background:color-mix(in srgb,var(--ink) 4%,transparent);border-radius:12px;padding:10px 6px 9px;font-size:12.5px;line-height:1.3;font-weight:700}
.fact svg{width:38px;height:38px}
.why{border-top:2px dashed var(--line);padding-top:12px;margin-bottom:6px}
.why h3{color:var(--red)}
.why p{font:700 25px/1.15 Caveat,"Segoe Print",cursive;color:var(--red2);margin:2px 0 4px;transform:rotate(-.6deg)}
:root[data-theme=dark] .why p{color:#ff7b70}
.hunt{position:fixed;z-index:6;left:12px;right:12px;bottom:132px;background:#1d3b34;color:#eef5ef;border-radius:18px;box-shadow:0 12px 34px rgba(0,0,0,.3);display:none;border:2px solid rgba(242,194,48,.45);overflow:hidden}
.hunt.show{display:block}
.hunt .hh{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 12px;background:rgba(0,0,0,.18)}
.hunt .hh svg{width:34px;height:34px;flex:none}
.hunt .hh b{flex:1;font:800 15px/1.15 "Baloo 2",sans-serif;color:var(--gold);text-transform:uppercase;letter-spacing:.05em}
.hunt .hh button{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font:800 20px/1 Nunito,sans-serif}
.hunt #cc{padding:12px 16px 14px;font-size:15px;line-height:1.5;color:#d7e6da}
.hunt #cc strong{color:#fff}
.hunt .hints{color:#fff;margin:8px 0 10px}
.hunt .hints li{margin:4px 0}
.hunt .hints li::marker{color:var(--gold);font-weight:800}
.hunt .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.hunt .tip{font-size:13.5px;color:#b9cdbf;margin-top:10px}
.hunt.min #cc{display:none}
.hunt .cmpb{background:var(--gold);color:#3a2a00;box-shadow:0 3px 0 #b88a10;margin-top:2px}
.hunt .heat{position:static;transform:none;margin:12px 14px 2px;box-shadow:none;white-space:normal}
.hunt.min .heat{margin-bottom:12px}
.hunt.min{left:12px;right:auto}
.huntbtn{display:none}
.lb{background:#fff;padding:12px 12px 14px;border-radius:6px;width:fit-content;max-width:min(1100px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.45);position:relative}
.lb img{display:block;max-width:100%;max-height:76vh;margin:0 auto;border-radius:2px}
.lb p{margin:10px 4px 0;color:#1f2a1f;font-weight:700}
.lb p small{display:block;font-weight:500;font-size:12px;color:#5d6a5d}
.lb .nv{position:absolute;top:calc(50% - 30px);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#1f2a1f;font:800 26px/1 Nunito,sans-serif;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.lb .nv.p{left:22px}.lb .nv.n{right:22px}
.lb .x{position:absolute;top:-16px;right:-16px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#1f2a1f;font-size:26px;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.clue{border-top:2px dashed var(--line);padding-top:10px;font-size:15px;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{min-height:44px;padding:0 18px;border-radius:22px;border:0;background:var(--red);color:#fff;font-weight:700;box-shadow:0 3px 0 var(--red2)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.mon{position:relative;border:0;background:none;padding:0;cursor:pointer;width:calc(60px * var(--k));height:calc(60px * var(--k));animation:shine 2.6s ease-in-out infinite}
.mon svg{width:100%;height:100%;display:block}
.mon .mi{display:block;position:relative;width:100%;height:100%;transform-origin:50% 100%;transition:opacity .3s}
.mon.hid .mi{opacity:0;transform:scale(.1)}.mon.hid{pointer-events:none}
.mon.arrive{animation:shinebig 1.4s ease-in-out 3}
.mon.arrive .mi{animation:mpop 1.1s cubic-bezier(.2,1.5,.4,1) both}
.mon.arrive::before,.mon.arrive::after{content:"";position:absolute;left:50%;bottom:-4px;width:24px;height:12px;margin-left:-12px;border-radius:50%;border:4px solid #f2c230;box-shadow:0 0 12px #fff3b0;animation:ring 1.5s ease-out 2 both;pointer-events:none}
.mon.arrive::after{animation-delay:.5s}
@keyframes mpop{0%{transform:scale(.1) translateY(30px);opacity:0}55%{transform:scale(1.4);opacity:1}100%{transform:scale(1)}}
@keyframes ring{0%{transform:scale(.3);opacity:1}100%{transform:scale(8);opacity:0}}
@keyframes shinebig{0%,100%{filter:drop-shadow(0 0 6px rgba(255,214,80,.9)) drop-shadow(0 2px 0 #fff)}50%{filter:drop-shadow(0 0 26px #ffd650) drop-shadow(0 0 10px #fff) drop-shadow(0 2px 0 #fff)}}
.mon span{position:absolute;right:-4px;z-index:1;bottom:-2px;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;border:2px solid #fff;font:800 12px/18px "Baloo 2",sans-serif;text-align:center;padding:0 3px}
@keyframes shine{0%,100%{filter:drop-shadow(0 0 4px rgba(255,214,80,.85)) drop-shadow(0 2px 0 #fff)}50%{filter:drop-shadow(0 0 14px rgba(255,214,80,1)) drop-shadow(0 2px 0 #fff)}}
.art{display:block;pointer-events:none;width:calc(var(--s) * var(--k));height:calc(var(--s) * var(--k))}
.flag{pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;transform:scale(var(--k));transform-origin:bottom left;transition:opacity .4s}
.flag.l{align-items:flex-end;transform-origin:bottom right}
.flag b{background:#fff;color:var(--red);font-weight:800;font-size:13px;line-height:1;padding:5px 8px 3px;border-radius:2px 6px 6px 2px;box-shadow:0 2px 4px rgba(0,0,0,.25);white-space:nowrap;text-transform:uppercase;letter-spacing:.02em}
.flag i{display:block;width:3px;height:20px;background:#7a5a36;border-radius:2px}
.hide-flags .flag{opacity:0!important}
.pol{width:16px;height:19px;background:#fbfaf6;border-radius:2px;padding:2px 2px 6px;box-shadow:0 1px 3px rgba(0,0,0,.35);transform:rotate(-9deg);cursor:pointer;display:none;border:0}
.pol i{display:block;height:100%;background:linear-gradient(150deg,#cfe8c5,#9cc7a6 60%,#7aa889)}
.zoomed .pol{display:block}.cam{display:none;width:52px;height:52px;border:0;padding:0;background:none;cursor:pointer}.cam i{display:block;width:100%;height:100%;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}.cam svg{width:100%;height:100%}.zoomed2 .cam{display:block}@keyframes bob{50%{transform:translateY(-7px)}}
.heat{position:fixed;z-index:5;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;background:color-mix(in srgb,var(--hc) 16%,#fff);color:#1f2a1f;border:3px solid var(--hc);border-radius:20px;padding:6px 14px 6px 6px;box-shadow:0 6px 18px rgba(0,0,0,.2);font:700 13px/1.25 Nunito,sans-serif;white-space:nowrap}
.heat .txt{display:grid}.heat small{font-size:13px;font-weight:700;color:#3d4a3d}.heat .cmp{width:54px;height:54px;flex:none}.heat .cmp svg{width:100%;height:100%}
.heat.show{display:flex}.heat b{color:var(--hc);font:800 21px/1.05 "Baloo 2",sans-serif;filter:brightness(.85)}
.xh{position:fixed;z-index:4;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid var(--hc,#2f6fd6);border-radius:50%;pointer-events:none;display:none;box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.xh::before,.xh::after{content:"";position:absolute;background:var(--hc,#2f6fd6);left:50%;top:50%;transform:translate(-50%,-50%)}.xh::before{width:2px;height:46px}.xh::after{width:46px;height:2px}
.xh.show{display:block}
.vig{position:fixed;inset:0;z-index:4;pointer-events:none;box-shadow:inset 0 0 110px 24px var(--hc,transparent);opacity:0;transition:opacity .5s,box-shadow .5s}.vig.show{opacity:.75}
.hints{margin:6px 0 8px;padding-left:22px;color:var(--ink)}.hints li{margin:2px 0}.tip{font-size:14px;margin-top:6px}.sm{min-height:38px;font-size:14px;padding:0 14px}
.polaroid .ph.photo{aspect-ratio:4/3;padding:0;overflow:hidden;background:#eee}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.modal{position:fixed;inset:0;z-index:9;background:rgba(10,20,25,.55);display:none;place-items:center;padding:20px;overflow:auto}
.modal.show{display:grid}
.polaroid{background:#fff;color:#1f2a1f;padding:14px 14px 18px;border-radius:4px;width:min(340px,86vw);box-shadow:0 20px 60px rgba(0,0,0,.4);transform:rotate(-2deg);text-align:center}
.polaroid .ph{aspect-ratio:1;background:linear-gradient(160deg,#ffe8b8,#f6b26b 45%,#d52b1e);display:grid;place-items:center;color:#fff;font-weight:700;padding:20px}
.polaroid h2{margin:12px 0 4px;font-size:22px}
.tile{display:inline-block;width:34px;height:38px;border-radius:6px;border:0;padding:0;color:#fff;font-weight:800;font-size:20px;line-height:38px;text-align:center;background:var(--c);box-shadow:0 3px 0 rgba(0,0,0,.25)}
#mlc{display:block;margin:-4px 0 14px;color:#5d6a5d;font-weight:700;font-size:13px}
.polaroid .tile{width:56px;height:62px;font-size:38px;line-height:62px;margin:8px 0 12px}
.puzzle{background:var(--bg);border-radius:20px;padding:22px 20px;width:min(580px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.puzzle h2{margin:0 0 4px;font-size:28px;line-height:1.1}
.puzzle p{margin:0 0 14px;color:var(--mute)}
.slots{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:16px}
.slots .w{display:flex;gap:3px}
.slot{width:30px;height:36px;border-radius:6px;border:2px dashed var(--c);background:none;padding:0;font:800 19px/32px "Baloo 2",sans-serif;color:#fff}
.slot.f{border-style:solid;background:var(--f,var(--c));cursor:grab;touch-action:none}
.slot.over{transform:scale(1.18);background:color-mix(in srgb,var(--c) 30%,transparent)}
.pool .tile{touch-action:none;cursor:grab}
.tile.drag{position:fixed;z-index:30;pointer-events:none;transform:scale(1.25) rotate(-6deg);box-shadow:0 12px 24px rgba(0,0,0,.35);margin:0}
.ghosted{opacity:.25}
.pool{border-top:2px dashed var(--line);padding-top:12px;min-height:54px}
.pool{display:flex;flex-wrap:wrap;gap:6px;min-height:40px}
.pool .tile{cursor:pointer}
.pool .tile:nth-child(3n){transform:rotate(-5deg)}.pool .tile:nth-child(3n+1){transform:rotate(4deg)}
.pool .none{color:var(--mute);font-size:14px}
.win .slot{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.25)}}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin:12px 0 4px;max-height:60vh;overflow:auto;padding:4px}.agrid[hidden],.aview[hidden]{display:none}.acell{position:relative;aspect-ratio:1;border:0;padding:4px 4px 16px;background:#fff;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.2);transform:rotate(var(--r));font:700 11px/1 Nunito,sans-serif;color:#5d6a5d}.acell .im{display:block;width:100%;height:100%;background:#eee center/cover no-repeat}.acell .im.ph{background:linear-gradient(160deg,#ffe8b8,#f6b26b 45%,#d52b1e)}.acell span:last-child{position:absolute;bottom:2px;left:0;right:0;text-align:center}.acell.e{background:#f1ece1;box-shadow:none;border:2px dashed #d8ccb0;transform:none;color:#b8ab8a}.acell.e .im{background:none;display:grid;place-items:center;font:800 22px/1 'Baloo 2',sans-serif}
.aview{margin:12px 0}.aimg{background:#fff;padding:10px 10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:rotate(-1.5deg)}.aimg img{width:100%;display:block;max-height:55vh;object-fit:contain;background:#eee}.aimg .ph{aspect-ratio:4/3;background:linear-gradient(160deg,#ffe8b8,#f6b26b 45%,#d52b1e)}#acap{font-weight:700;margin:12px 0 8px}

const DATA={"days":[{"d":1,"name":"Maison Cailler, Broc","lon":7.108506,"lat":46.60736,"kind":"Gourmand","text":"La fabrique de chocolat Cailler, à Broc en Gruyère. On suit l'histoire du chocolat suisse, on voit les machines tourner, et la visite finit par une dégustation à volonté. Ensuite, Gruyères et sa double crème sont à cinq minutes.","en":{"name":"Maison Cailler, Broc","kind":"Treats","text":"The Cailler chocolate factory in Broc, in the Gruyère region. We follow the story of Swiss chocolate, watch the machines at work, and the tour ends with all-you-can-taste chocolate. Gruyères and its double cream are five minutes away."},"photo":{"lon":9.2885,"lat":47.0902,"src":"photos/1.jpg","hints":{"fr":["Une activité unique, après une randonnée.","Beaucoup de sport, tant pour les animaux que pour les propriétaires.","Course de vaches !!"],"en":["A one-of-a-kind activity, after a hike.","Plenty of exercise, for the animals and their owners alike.","Cow race!!"]},"cap":{"fr":"Alp Tannenboden, Flumserberg. Le jour de la course de vaches.","en":"Alp Tannenboden, Flumserberg. Cow race day."}},"bear":157,"dist":703,"gallery":[{"src":"photos/d1-a.jpg","pos":"50% 40%","fr":"La Maison Cailler et ses vaches dorées, au printemps.","en":"Maison Cailler and its golden cows, in spring.","credit":"Fridolin freudenfett · CC BY-SA 4.0 · Wikimedia Commons"},{"src":"photos/d1-b.jpg","pos":"50% 45%","fr":"Le mur de tablettes. Bonne chance pour choisir.","en":"The wall of chocolate bars. Good luck choosing.","credit":"Fridolin freudenfett · CC BY-SA 4.0 · Wikimedia Commons"},{"src":"photos/d1-c.jpg","pos":"50% 50%","fr":"Un wagon Belle Époque, comme ceux du Train du Chocolat, au-dessus de Montreux.","en":"A Belle Époque carriage, like the Chocolate Train’s, above Montreux.","credit":"Luxury Train Club · CC BY-SA 2.0 · Wikimedia Commons"},{"src":"photos/d1-d.jpg","pos":"50% 50%","fr":"La route vers Broc, au cœur de la Gruyère.","en":"The road to Broc, in the heart of the Gruyère.","credit":"Fridolin freudenfett · CC BY-SA 4.0 · Wikimedia Commons"}],"rich":{"fr":{"sub":"Broc, en Gruyère · à trois quarts d’heure de chez nous","paras":["On commence en douceur : par du chocolat. Cailler, c’est la plus ancienne marque de chocolat suisse encore en activité. François-Louis Cailler s’est lancé en 1819, et depuis 1898 tout se fabrique ici, à Broc, avec le lait des vaches qui broutent juste autour.","La visite dure environ une heure. On traverse l’histoire du cacao comme dans un petit spectacle, on regarde les machines tourner, ça sent le chocolat partout… et tout au bout, il y a la salle de dégustation. À volonté. Je décline toute responsabilité pour ce qui s’y passera."],"plan":["Le plan parfait","Un jour de printemps, on prend le Train du Chocolat à Montreux : des wagons Belle Époque, un café et un croissant au chocolat pendant qu’on monte au-dessus du lac, un arrêt fromage à Gruyères, puis Cailler. Et si on a encore de la place, l’Atelier du Chocolat nous apprend à faire nos propres chocolats."],"facts":[["chocolate","Dégustation à volonté"],["train","Train du Chocolat, de mai à septembre"],["cow","Le lait des vaches de la Gruyère"]],"why":["Pourquoi je pense à toi","Parce que je connais ta dent sucrée, et que j’ai très envie de te voir devant le mur de tablettes."]},"en":{"sub":"Broc, in the Gruyère · 45 minutes from home","paras":["We’re starting gently: with chocolate. Cailler is the oldest Swiss chocolate brand still going. François-Louis Cailler started out in 1819, and since 1898 everything has been made right here in Broc, with milk from the cows grazing all around.","The visit takes about an hour. The story of cocoa unfolds like a little show, the machines whirr away, everything smells of chocolate… and at the very end there’s the tasting room. All you can eat. I take no responsibility for what happens in there."],"plan":["The perfect plan","One spring day, we catch the Chocolate Train in Montreux: Belle Époque carriages, coffee and a chocolate cr   const path=p.url.slice(7),kind=path[0],e=MAN.tiles[path];

own',e=>{e.preventDefault();dial.setPointerCapture(e.pointerId);dr={a:ang(e),b:map.getBearing(),x:e.clientX,y:e.clientY,m:false}});dial.addEventListener('pointermove',e=>{if(!dr)return;if(Math.hypot(e.clientX-dr.x,e.clientY-dr.y)>4)dr.m=true;if(dr.m)map.setBearing(dr.b-(ang(e)-dr.a))});dial.addEventListener('pointerup',()=>{if(dr&&!dr.m)map.easeTo({bearing:0,duration:700});dr=null});dial.addEventListener('pointercancel',()=>dr=null);dial.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();map.easeTo({bearing:map.getBearing()+(e.key==='ArrowRight'?15:-15),duration:300})}});d.querySelectorAll('.rbtn button').forEach(b=>{b.title=t()[b.id==='rotl'?'rotl':'rotr'];b.onclick=()=>map.easeTo({bearing:map.getBearing()+ +b.dataset.r,duration:600})});return d},onRemove(){}},'top-right');
